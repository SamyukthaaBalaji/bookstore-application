spring.application.name=api-gateway-book
server.port=8080


spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.routes[0].id=book-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://book-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/books/**

spring.cloud.gateway.server.webflux.routes[1].id=review-service
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].uri=lb://review-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.server.webflux.routes[2].id=recommendation-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://recommendation-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/recommendations/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1


spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webflux.routes[4].id=cart-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/cart/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true




logging.level.org.springframework.cloud.gateway=DEBUG